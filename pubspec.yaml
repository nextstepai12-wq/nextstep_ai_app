name: nextstep_ai_app
description: "AI-Powered Academic & Career Guidance Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  bloc: ^8.1.2

  # UI Icons
  cupertino_icons: ^1.0.8

  share_plus: ^12.0.2

  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Dependency Injection
  get_it: ^7.6.0
  
  # Networking

  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Navigation
  go_router: ^12.1.1
  
  # UI
  flutter_screenutil: ^5.9.0
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  shimmer: ^3.0.0
  fl_chart: ^0.66.0
  
  # Forms
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0  
  # Utilities
  url_launcher: ^6.1.14
  connectivity_plus: ^5.0.1
  
  # Chat
  chat_bubbles: ^1.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.0
  # build_runner: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#2563EB"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/logo.png
    - assets/fonts/
    - assets/icons/